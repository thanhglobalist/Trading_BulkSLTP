# nginx reverse-proxy config for sltp-tg-bot.
# Replace bot.example.com with your real hostname; obtain a Let's Encrypt
# certificate via:
#   certbot --nginx -d bot.example.com
# before enabling this site.

# Per-IP rate limit (60 req/min). Tune zone size for your instance.
limit_req_zone $binary_remote_addr zone=sltp_per_ip:10m rate=60r/m;

# Optional: per-token rate limit. The Authorization header is hashed because
# nginx variables can't be combined directly with limit_req_zone keys.
map $http_authorization $sltp_token_key {
    default "";
    "~*^Bearer\s+(.+)$" $1;
}
limit_req_zone $sltp_token_key zone=sltp_per_token:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;
    # Redirect everything to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.example.com;

    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 10 MB max body for daily-summary chart screenshots
    client_max_body_size 10m;

    # No public docs / openapi
    location ~ ^/(docs|redoc|openapi.json)$ {
        return 404;
    }

    # Health check (no rate limit)
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Long-poll endpoint — generous read timeout
    location = /api/v1/jobs/next {
        limit_req zone=sltp_per_ip burst=10 nodelay;
        limit_req zone=sltp_per_token burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Everything else under /api/v1
    location /api/v1/ {
        limit_req zone=sltp_per_ip burst=20 nodelay;
        limit_req zone=sltp_per_token burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anything else: 404 (do not expose root listing)
    location / {
        return 404;
    }
}
