[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sltp-tg-bot"
version = "1.0.0"
description = "Telegram control bridge for the MT5 BulkSLTPUpdater EA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Thanh Nguyen", email = "thanhglobalist@gmail.com" }
]
keywords = ["telegram", "mt5", "trading", "bot", "aiogram"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "aiogram>=3.4,<4",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "aiosqlite>=0.19,<1",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://t.me/thanhglobalist"
Author = "https://t.me/thanhglobalist"

[project.scripts]
sltp-tg-bot = "sltp_tg_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
